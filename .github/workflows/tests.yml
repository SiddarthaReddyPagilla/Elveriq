name: Elveriq Python Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elveriq_test
          POSTGRES_PASSWORD: elveriq_test
          POSTGRES_DB: elveriq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elveriq_test -d elveriq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ELVERIQ_TEST_POSTGRES_URL: postgresql+psycopg://elveriq_test:elveriq_test@127.0.0.1:5432/elveriq_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete test suite
        run: python -m pytest -q
