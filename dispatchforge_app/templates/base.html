<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Elveriq — warehouse management software for inventory, orders, transfers, and warehouse operations.">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/styles.css">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/brand.css">
</head>
<body>
  {% block skip_link %}{% endblock %}
  <header class="site-header">
    <a href="/" class="brand" aria-label="Elveriq Home"><span class="brand-mark">E</span> Elver<span class="brand-accent">iq</span></a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="/demo">Live sample</a>
      <a href="/login">Sign in</a>
      <a class="button button-small" href="/register">Create workspace</a>
    </nav>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer class="site-footer">Elveriq · Simpler operations. A brighter tomorrow.</footer>
</body>
</html>
