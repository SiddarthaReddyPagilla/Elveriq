# Example blueprint. Add persistent PostgreSQL in hosting settings before deploying.
services:
  - type: web
    name: dispatchforge-warehouse-cloud
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dispatchforge_app.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
